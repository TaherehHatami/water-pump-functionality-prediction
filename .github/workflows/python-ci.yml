name: Python CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Check Python syntax
        run: |
          python_files=$(find . -type f -name "*.py" -not -path "./.git/*")
          if [ -n "$python_files" ]; then
            python -m compileall -q .
          else
            echo "No Python files found; syntax check skipped."
          fi

      - name: Run tests
        run: |
          if find . -type f \( -name "test_*.py" -o -name "*_test.py" \) -not -path "./.git/*" | grep -q .; then
            python -m pytest -q
          else
            echo "No pytest tests found; test step skipped."
          fi
